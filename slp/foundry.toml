# Test profile only. Canonical release identity is checked by tools/build.py.
# Use the repository's approved export/runner; never execute in the checkout.
# The existing 76 Solidity tests and test-only dependencies migrate in Batch 2.
[profile.default]
src = "contracts"
test = "tests"
out = "out-test"
cache_path = "cache-test"
snapshots = "cache-test/snapshots"
libs = []
solc_version = "0.8.28"
auto_detect_solc = false
offline = true
auto_detect_remappings = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
use_literal_content = true
ffi = false
fs_permissions = []
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
]
