# Test profile only for the FaroSwap module; canonical release identity stays with the
# stPROS core gates. Run only inside the repository's approved export/runner, never in
# the checkout (see AGENTS.md). Dependencies are byte-exact copies of the frozen root
# vendor closure under lib/ and test-lib/ (see DEPENDENCIES.json), mirroring the SLP
# module's isolation pattern.
[profile.default]
src = "contracts"
test = "tests"
out = "out-test"
cache_path = "cache-test"
snapshots = "cache-test/snapshots"
libs = []
solc_version = "0.8.28"
auto_detect_solc = false
offline = true
auto_detect_remappings = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
ffi = false
fs_permissions = []
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
  "forge-std/=test-lib/forge-std/src/",
]
